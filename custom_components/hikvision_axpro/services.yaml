reload:
  name: Reload
  description: Reload all sensor entities and config
purge:
  name: Purge invalid sensors
  description: Purge old invalid binary sensors registered as sensors
bypass_zone:
  name: Bypass zone
  description: >
    Bypass one or more zones. The bypass is tracked by the integration and
    removed automatically when the zone recovers while armed, or on disarm.
  target:
    entity:
      integration: hikvision_axpro
      domain: binary_sensor
  fields:
    zone_id:
      name: Zone ID
      description: Zone number from the panel; use instead of targeting an entity
      required: false
      selector:
        number:
          min: 0
          mode: box
    config_entry_id:
      name: Config entry ID
      description: Optional when multiple panels are configured
      required: false
      selector:
        text:
unbypass_zone:
  name: Unbypass zone
  description: Restore (remove the bypass of) one or more zones
  target:
    entity:
      integration: hikvision_axpro
      domain: binary_sensor
  fields:
    zone_id:
      name: Zone ID
      description: Zone number from the panel; use instead of targeting an entity
      required: false
      selector:
        number:
          min: 0
          mode: box
    config_entry_id:
      name: Config entry ID
      description: Optional when multiple panels are configured
      required: false
      selector:
        text:
recover_bypass_zone:
  name: Recover bypass zone (deprecated)
  description: Deprecated alias of unbypass_zone, kept for existing automations
  target:
    entity:
      integration: hikvision_axpro
      domain: binary_sensor
  fields:
    zone_id:
      name: Zone ID
      description: Zone number from the panel; use instead of targeting an entity
      required: false
      selector:
        number:
          min: 0
          mode: box
    config_entry_id:
      name: Config entry ID
      description: Optional when multiple panels are configured
      required: false
      selector:
        text:
clear_all_bypasses:
  name: Clear all bypasses
  description: >
    Remove every bypass on the panel, regardless of how it was applied.
    Targeting an area panel clears only that area's zones.
  target:
    entity:
      integration: hikvision_axpro
      domain: alarm_control_panel
  fields:
    config_entry_id:
      name: Config entry ID
      description: Optional when multiple panels are configured
      required: false
      selector:
        text:
arm_away_with_bypass:
  name: Arm away with bypass
  description: Bypass open/triggered zones then arm away
  fields:
    sub_id:
      name: Subsystem ID
      description: Optional area/subsystem id
      required: false
      selector:
        number:
          min: 1
          mode: box
    config_entry_id:
      name: Config entry ID
      required: false
      selector:
        text:
arm_home_with_bypass:
  name: Arm home with bypass
  description: Bypass open/triggered zones then arm stay/home
  fields:
    sub_id:
      name: Subsystem ID
      description: Optional area/subsystem id
      required: false
      selector:
        number:
          min: 1
          mode: box
    config_entry_id:
      name: Config entry ID
      required: false
      selector:
        text:
control_siren:
  name: Control siren
  description: Open or close a siren when the panel supports local siren control
  fields:
    siren_id:
      name: Siren ID
      required: true
      selector:
        number:
          min: 1
          mode: box
    enabled:
      name: Sound siren
      description: Turn siren on (true) or off (false)
      required: true
      selector:
        boolean:
    config_entry_id:
      name: Config entry ID
      required: false
      selector:
        text:
one_key_alarm:
  name: One-key alarm
  description: >
    Trigger or clear the panel one-key/panic alarm when HostControlCap
    reports isSptOneKeyAlarmCtrl (loud — use with care)
  fields:
    enabled:
      name: Trigger alarm
      description: true to trigger, false to clear/silence
      required: false
      default: true
      selector:
        boolean:
    config_entry_id:
      name: Config entry ID
      required: false
      selector:
        text:
